name: Deploy Charm Studio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect web directory
        id: dirs
        run: |
          if [ -f "web/package.json" ]; then
            echo "app_dir=web" >> "$GITHUB_OUTPUT"
            echo "dist_dir=web/dist" >> "$GITHUB_OUTPUT"
          else
            echo "app_dir=." >> "$GITHUB_OUTPUT"
            echo "dist_dir=dist" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "**/package-lock.json"

      - name: Install web dependencies
        working-directory: ${{ steps.dirs.outputs.app_dir }}
        run: npm ci

      - name: Build production bundle
        working-directory: ${{ steps.dirs.outputs.app_dir }}
        env:
          GITHUB_PAGES: "true"
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.dirs.outputs.dist_dir }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
